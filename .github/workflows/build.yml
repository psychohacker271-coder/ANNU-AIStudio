name: Build ANNU APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android Studio project
        run: |
          mkdir project
          unzip -q annuapp-nov-24-2026-11-16-19-pm.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses >/dev/null; sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ANNU-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
